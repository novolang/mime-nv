[package]
name        = "mime-nv"
version     = "0.1.0"
description = "Media types as values: `type/subtype; param=value` parsed into spans over the caller's own string with RFC 2045's token and quoted-string rules, mime_guess's extension table looked up both ways, the WHATWG MIME Sniffing Standard over the bytes, the supplied type and the no-sniff flag, and RFC 9110 `Accept` negotiation answering the best of a caller's own offers.  The codes and the byte-at-a-time sniffer build for a microcontroller."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: a media type is a string the caller already holds, the
# extension table is data, and sniffing is a comparison against a
# pattern table.  Nothing is read.  The package is handed the first
# bytes of a file and never opens one.
#
# It carries `tests/embedded_probe.nv`, which builds `mimecode` and
# `mimesniff_core` for a Cortex-M4 and checks fifteen answers on it
# under QEMU.  `tests/alloc_scan.sh` reads the emitted LLVM and checks
# that no function in those two modules calls the allocator.
layer       = "core"

category    = "web"

tags        = ["mime", "media-type", "content-type", "sniffing", "accept", "content-negotiation", "sans-io", "embedded"]
repository  = "https://github.com/novolang/mime-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.12.1"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "What a file is, from its name and from its first bytes"

[dependencies]
# None.  http-codec-nv is not here: a `Content-Type` is a header value,
# which is a string, and which header it came out of belongs to whatever
# parsed the message.  unicode-nv is not here either: RFC 2045 defines a
# media type over ASCII, type and subtype compare ASCII
# case-insensitively, and a charset name is an ASCII label.
